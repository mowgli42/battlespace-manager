services:
  display-portal:
    build:
      context: .
      dockerfile: services/display-portal/Dockerfile
    ports:
      - "8939:8939"
    environment:
      DISPLAY_PUBLIC_HOST: localhost
      ENTITY_UI_PROBE_URL: http://entity-display-web:8930
      ENTITY_API_PROBE_URL: http://entity-display-api:8030
      BATTLESPACE_UI_PROBE_URL: http://battlespace-display-web:8931
      BATTLESPACE_API_PROBE_URL: http://battlespace-display-api:8031
      RF_UI_PROBE_URL: http://rf-display-web:8932
      RF_API_PROBE_URL: http://rf-display-api:8032
      PROMETHEUS_PROBE_URL: http://host.docker.internal:8109
      GRAFANA_PROBE_URL: http://host.docker.internal:8900
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - entity-display-api
      - entity-display-web
      - battlespace-display-api
      - battlespace-display-web
      - rf-display-api
      - rf-display-web

  entity-display-api:
    build:
      context: .
      dockerfile: services/entity-display/api/Dockerfile
    ports:
      - "8030:8030"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      COMMLINK_DIRECTORY_XML: /app/fixtures/commlink-directory-v1.1.xml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  entity-display-web:
    build:
      context: .
      dockerfile: services/entity-display/web/Dockerfile
      args:
        VITE_API_URL: http://entity-display-api:8030
    ports:
      - "8930:8930"
    depends_on:
      - entity-display-api

  battlespace-display-api:
    build:
      context: .
      dockerfile: services/battlespace-display/api/Dockerfile
    ports:
      - "8031:8031"
    environment:
      ADVISOR_EMBEDDED: "0"
      REDIS_URL: memory://

  battlespace-display-web:
    build:
      context: .
      dockerfile: services/battlespace-display/web/Dockerfile
    ports:
      - "8931:8931"
    depends_on:
      - battlespace-display-api

  rf-display-api:
    build:
      context: .
      dockerfile: services/rf-display/api/Dockerfile
    ports:
      - "8032:8032"
    environment:
      REDIS_URL: memory://
      COMMLINK_DIRECTORY_XML: /app/fixtures/commlink-directory-v1.1.xml

  rf-display-web:
    build:
      context: .
      dockerfile: services/rf-display/web/Dockerfile
    ports:
      - "8932:8932"
    depends_on:
      - rf-display-api
